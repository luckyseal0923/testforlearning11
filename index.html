<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仁愛醫院｜教具借用</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#19332e;font:15px system-ui,'Microsoft JhengHei',sans-serif}header{background:#143f37;color:white;padding:30px max(24px,calc((100% - 1120px)/2))}header p{color:#c8dfd9;margin-bottom:0}main{max-width:1120px;margin:auto;padding:25px}h1{margin:8px 0;font-size:30px}.notice{padding:14px;background:#fff3d7;border:1px solid #f0d598;border-radius:12px;line-height:1.7}.tabs{display:flex;gap:10px;margin:20px 0}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px 16px;background:#186a58;color:white}button.secondary{background:white;color:#24564a;border:1px solid #bdd0c8}button:disabled{opacity:.5}.panel{display:none}.panel.active{display:block}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center}.toolbar input{max-width:350px}input,select,textarea{font:inherit;padding:11px;border:1px solid #cad9d1;border-radius:8px;width:100%;background:white}label{display:block;font-weight:600;margin:12px 0 5px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.card{background:white;border:1px solid #dfe9e3;padding:18px;border-radius:13px;display:flex;flex-direction:column;gap:10px}.card-photo{width:100%;height:160px;object-fit:contain;background:#f6f8f6;border-radius:8px}.card h3{margin:0;font-size:17px}.small{color:#617a70;font-size:13px}.card button{margin-top:auto}.list{display:grid;gap:12px}.line{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.badge{color:#176c56;background:#e4f3ec;padding:5px 9px;border-radius:20px;font-size:13px}dialog{border:0;border-radius:16px;width:min(94vw,540px);padding:24px;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#092b24a8}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}footer{margin:30px 0;color:#647b73;font-size:13px}@media(max-width:600px){.row{grid-template-columns:1fr}.toolbar{display:block}.toolbar input{max-width:none}}
</style></head><body><header><div>仁愛醫院 · 臨床技能中心</div><h1>教具借用平台</h1><p>查詢教學資源，整理借用申請與歸還紀錄</p></header><main><div class="notice"><b>本機試用版</b>：試用版使用 Supabase 儲存借用資料，但管理頁沒有帳號權限；請勿開放外網或作為正式借用紀錄。總數來自原始清單，實際可借數量與歸還狀況請由管理人員確認。</div><div class="tabs"><button id="catalogTab">教具目錄</button><button class="secondary" id="loansTab">借用管理</button></div><section id="catalog" class="panel active"><div class="toolbar"><div><h2>教具目錄</h2><p class="small" id="count"></p></div><input id="search" placeholder="搜尋教具名稱" aria-label="搜尋教具"></div><div class="grid" id="cards"></div></section><section id="loans" class="panel"><div class="toolbar"><div><h2>借用紀錄</h2><p class="small">此頁僅供本機流程試用；核准前請確認實際庫存及逾期未歸還的教具。</p></div><button class="secondary" id="reload">重新整理</button></div><div class="list" id="records"></div></section><footer>資料來源：臨床技能教學教材／教具一覽表。內容與數量請於正式使用前盤點。</footer></main><dialog id="dialog"><form id="form"><div class="line"><h2>填寫借用申請</h2><button type="button" class="secondary" id="close">關閉</button></div><p id="chosen"></p><input type="hidden" name="asset_id"><div class="row"><div><label>借用人</label><input name="borrower" required maxlength="120"></div><div><label>單位</label><input name="unit" required maxlength="120"></div></div><label>聯絡方式</label><input name="contact" required maxlength="120"><label>借用用途</label><input name="purpose" required maxlength="120"><div class="row"><div><label>借用日期</label><input type="date" name="start" required></div><div><label>預計歸還日期</label><input type="date" name="due" required></div></div><label>數量</label><input type="number" min="1" name="quantity" value="1" required><p class="small">送出後為待審核，需由管理人員確認。</p><button>送出申請</button><p id="error" role="alert"></p></form></dialog><script>
let assets=[], requestKey=null;const $=s=>document.querySelector(s);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,data){let r=await fetch(url,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});let j=await r.json();if(!r.ok)throw Error(j.error);return j}function show(which){for(let x of ['catalog','loans'])$('#'+x).classList.toggle('active',x===which);$('#catalogTab').className=which==='catalog'?'':'secondary';$('#loansTab').className=which==='loans'?'':'secondary';if(which==='loans')loadLoans()}function render(){let q=$('#search').value.trim().toLowerCase();let list=assets.filter(a=>a.name.toLowerCase().includes(q));$('#count').textContent='共 '+assets.length+' 項教具｜符合 '+list.length+' 項';$('#cards').innerHTML=list.map(a=>'<article class="card"><img class="card-photo" src="/photos/'+String(a.id).padStart(2,'0')+'.png" alt="'+escapeHtml(a.name)+' 的教具照片" loading="lazy"><span class="small">教具 '+String(a.id).padStart(2,'0')+'</span><h3>'+escapeHtml(a.name)+'</h3><div class="small">原始清單數量 '+a.quantity+' 件</div><button data-id="'+a.id+'">申請借用</button></article>').join('')||'<p>沒有符合的教具。</p>'}$('#cards').onclick=e=>{let id=Number(e.target.dataset.id);let a=assets.find(x=>x.id===id);if(!a)return;$('#form').reset();requestKey=crypto.randomUUID();$('#form').elements.asset_id.value=id;$('#form').elements.quantity.max=a.quantity;$('#chosen').textContent=a.name+'（清單數量 '+a.quantity+'）';$('#error').textContent='';$('#dialog').showModal()};$('#close').onclick=()=>$('#dialog').close();$('#form').onsubmit=async e=>{e.preventDefault();let btn=e.target.querySelector('button[type=submit],button:not([type])');btn.disabled=true;try{let x=Object.fromEntries(new FormData(e.target));x.request_key=requestKey;let r=await api('/api/submit',x);$('#dialog').close();alert('申請已寫入 Supabase，狀態：待審核。單號：'+r.id);show('loans')}catch(err){$('#error').textContent=err.message}finally{btn.disabled=false}};async function loadLoans(){try{let rows=await api('/api/loans');let transitions={'待審核':['已核准','已退回'],'已核准':['借出中','已退回'],'借出中':['已歸還']};$('#records').innerHTML=rows.map(r=>{let a=assets.find(x=>x.id===r.asset_id);return '<article class="card"><div class="line"><h3>'+escapeHtml(a?.name||'未知教具')+'</h3><span class="badge">'+escapeHtml(r.status)+'</span></div><div>'+escapeHtml(r.borrower)+' · '+escapeHtml(r.unit)+' · '+escapeHtml(r.contact)+'</div><div class="small">'+escapeHtml(r.start)+' 至 '+escapeHtml(r.due)+'｜數量 '+r.quantity+'｜'+escapeHtml(r.purpose)+'</div><div class="actions">'+(transitions[r.status]||[]).map(s=>'<button class="secondary" data-id="'+escapeHtml(r.id)+'" data-status="'+s+'">'+s+'</button>').join('')+'</div></article>'}).join('')||'<p>目前沒有借用紀錄。</p>'}catch(e){$('#records').textContent=e.message}}$('#records').onclick=async e=>{let id=e.target.dataset.id,status=e.target.dataset.status;if(!id)return;try{await api('/api/status',{id,status});await loadLoans()}catch(err){alert(err.message)}};$('#search').oninput=render;$('#catalogTab').onclick=()=>show('catalog');$('#loansTab').onclick=()=>show('loans');$('#reload').onclick=loadLoans;api('/api/catalog').then(x=>{assets=x;render()}).catch(e=>$('#cards').textContent=e.message);
</script></body></html>
